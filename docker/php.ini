; Production settings of Panier Sauvage (loaded after php.ini-production).
expose_php = 0
date.timezone = Europe/Paris
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 10M

; Sessions live in a Docker volume so that deployments do not log everybody out.
session.save_path = /app/var/sessions
session.use_strict_mode = 1
session.gc_maxlifetime = 1209600

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes inside a running container.
opcache.validate_timestamps = 0
opcache.preload = /app/config/preload.php

apc.enable_cli = 1
