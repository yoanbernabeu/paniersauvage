# Production stack for a single VPS. Full walkthrough: docs/DEPLOY.md
#
#   docker compose --env-file .env.prod -f compose.prod.yaml pull
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d --wait
#
# Every value comes from .env.prod (never committed, see .env.prod.example).
name: panier-sauvage-prod

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE in .env.prod}
  restart: unless-stopped
  env_file:
    - path: ${APP_ENV_FILE:-.env.prod}
      required: true
  environment: &app-environment
    APP_ENV: prod
    APP_DEBUG: "0"
    DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=utf8
  depends_on:
    database:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env.prod}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/app/public/uploads
      - sessions:/app/var/sessions

  worker:
    <<: *app
    # Mails (async) and recurring tasks (scheduler_default). The process exits after one hour or
    # above 256 MB and Docker restarts it: memory stays flat and new code is picked up.
    command:
      - php
      - bin/console
      - messenger:consume
      - async
      - scheduler_default
      - --time-limit=3600
      - --memory-limit=256M
      - --no-interaction
    healthcheck:
      disable: true
    stop_grace_period: 30s
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      database:
        condition: service_healthy
      # Healthy app = migrations done.
      app:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql

volumes:
  caddy_data:
  caddy_config:
  uploads:
  sessions:
  database_data:
