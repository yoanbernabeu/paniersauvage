doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Shop:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shop/Entity'
                prefix: 'App\Shop\Entity'
            Billing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Billing/Entity'
                prefix: 'App\Billing\Entity'
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Entity'
                prefix: 'App\Catalog\Entity'
            Delivery:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Delivery/Entity'
                prefix: 'App\Delivery\Entity'
            Sale:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Sale/Entity'
                prefix: 'App\Sale\Entity'
            Customer:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Customer/Entity'
                prefix: 'App\Customer\Entity'
            Ordering:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ordering/Entity'
                prefix: 'App\Ordering\Entity'
            Notification:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notification/Entity'
                prefix: 'App\Notification\Entity'
            Legal:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Legal/Entity'
                prefix: 'App\Legal\Entity'
            Accounting:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Accounting/Entity'
                prefix: 'App\Accounting\Entity'
            Recurring:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Recurring/Entity'
                prefix: 'App\Recurring\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
