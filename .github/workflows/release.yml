name: Release image

# Publishing a GitHub release (tag vX.Y.Z) builds the production image for amd64 and arm64 and
# pushes it to GHCR with its version tags, for anyone running their own instance:
#   ghcr.io/<owner>/<repo>:1.2.3, :1.2, :1 (from 1.0.0 on) and :stable (not for pre-releases).
# `:latest` stays owned by deploy.yml (latest commit of main); release images never move it.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the release image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the tag is a version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version (expected v1.2.3 or v1.2.3-rc.1)."
            exit 1
          fi

      - name: Compute the image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.event.release.tag_name, 'v0.') && !startsWith(github.event.release.tag_name, '0.') }}
            type=raw,value=stable,enable=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=Panier Sauvage
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Attest the image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Empreinte : \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
