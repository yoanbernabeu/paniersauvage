name: Deploy

# Runs after a successful CI on main: builds the production image, pushes it to GHCR, then
# updates the VPS over SSH. Nothing runs until the SSH secrets exist (see docs/DEPLOY.md).
#
# Repository secrets:
#   SSH_HOST         VPS host name or IP address                              (required)
#   SSH_USER         SSH user allowed to run docker                           (required)
#   SSH_KEY          private key of that user (OpenSSH format)                (required)
#   SSH_PORT         SSH port                                                 (optional, default 22)
#   SSH_KNOWN_HOSTS  output of `ssh-keyscan -p <port> <host>`                 (recommended)
#   DEPLOY_PATH      directory holding .env.prod on the VPS                   (optional, default /opt/panier-sauvage)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Check deployment prerequisites
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Are the SSH secrets configured?
        id: secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped: SSH_HOST, SSH_USER and SSH_KEY secrets are not all set."
          fi

  build:
    name: Build and push the image
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout the commit validated by the CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute the image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VPS
    needs: [guard, build]
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/panier-sauvage' }}
      APP_IMAGE: ${{ needs.build.outputs.image }}:${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set: the host key is trusted on first use."
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          {
            echo "Host vps"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config

      - name: Upload the compose file and the backup script
        run: |
          # shellcheck disable=SC2029 # expanding on the runner side is intended
          ssh vps "mkdir -p '$DEPLOY_PATH/docker'"
          scp compose.prod.yaml "vps:$DEPLOY_PATH/compose.prod.yaml"
          scp docker/backup-database.sh "vps:$DEPLOY_PATH/docker/backup-database.sh"

      - name: Pull the image and restart the stack
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token is piped on stdin: it never appears in the remote command line.
          # shellcheck disable=SC2029 # expanding on the runner side is intended
          printf '%s\n' "$GHCR_TOKEN" | ssh vps "
            set -eu
            cd '$DEPLOY_PATH'
            test -f .env.prod || { echo 'Missing .env.prod in $DEPLOY_PATH (see docs/DEPLOY.md)' >&2; exit 1; }
            chmod +x docker/backup-database.sh
            docker login ghcr.io --username '$GHCR_USER' --password-stdin
            export APP_IMAGE='$APP_IMAGE'
            docker compose --env-file .env.prod -f compose.prod.yaml pull
            docker compose --env-file .env.prod -f compose.prod.yaml up -d --wait --remove-orphans
            docker logout ghcr.io
            docker image prune -f
          "

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
