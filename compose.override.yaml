# Développement local uniquement : ports fixes pour PostgreSQL et Mailpit.
services:
  database:
    ports:
      - "54329:5432"

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
